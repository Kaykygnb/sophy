<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sophy — editor</title>
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="sophy.css" />
    <link rel="stylesheet" href="../design-system.css" />
    <link rel="stylesheet" href="visual.css" />
  </head>
  <body>
    <header>
      <strong>Sophy</strong><span id="status" aria-live="polite">Carregando…</span>
      <div class="sp"></div>
      <button id="openComments" type="button" aria-label="Comentários" title="Comentários"></button>
      <details class="page-options">
        <summary aria-label="Opções da página" title="Ícone e capa"></summary>
        <div class="page-actions">
          <button id="addIcon">☺ Adicionar ícone</button
          ><button id="addCover">▧ Adicionar capa</button>
        </div>
      </details>
      <button
        id="more"
        aria-label="Aparência, layout e documento"
        title="Fonte, largura e sumário da nota"
        aria-haspopup="true"
        aria-expanded="false"
      >
        ⋯
      </button>
    </header>
    <section id="pageCover" aria-label="Capa da página" hidden>
      <button id="changeCover">Alterar capa</button>
    </section>
    <main id="main">
      <p id="notePath" class="note-breadcrumb"></p>
      <button id="pageIcon" aria-label="Alterar ícone" hidden></button>
      <div id="title" contenteditable="false" data-ph="Sem título" spellcheck="true"></div>
      <details class="note-details">
        <summary>Propriedades</summary>
        <section id="noteProperties" aria-label="Propriedades personalizadas"></section>
        <details id="noteInfo">
          <summary>Informações da nota</summary>
          <dl id="noteInfoValues"></dl>
        </details>
      </details>
      <div id="page"></div>
    </main>
    <nav id="toc" aria-label="Sumário"></nav>
    <div id="layout" class="pop">
      <div id="layoutBody"></div>
      <div class="docacts">
        <button id="import">Importar Markdown…</button
        ><input
          id="importFile"
          type="file"
          accept=".md,.markdown,.txt,text/markdown,text/plain"
          hidden
        /><button id="export">Exportar Markdown</button>
      </div>
    </div>
    <div id="colors" class="pop"></div>
    <div id="tmenu" class="pop" role="menu"></div>
    <div id="box"></div>
    <div id="drop"></div>
    <div id="menu" class="pop"></div>
    <div id="acts" class="pop"></div>
    <div id="tools" class="pop"></div>
    <dialog id="pageDialog" aria-labelledby="dialogTitle">
      <button id="dialogClose" aria-label="Fechar">✕</button>
      <h2 id="dialogTitle"></h2>
      <div id="dialogContent"></div>
    </dialog>
    <script src="../appearance.js"></script>
    <script src="../icons.js"></script>
    <script src="marked.js"></script>
    <script src="../note-links.js"></script>
    <script src="markdown.js"></script>
    <script src="engine.js"></script>
    <script src="bridge.js"></script>
    <script src="wikilinks.js"></script>
  </body>
</html>
